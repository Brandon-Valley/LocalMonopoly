name: Add GitHub button

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/add-github-button.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = '''
    .github-corner-button {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      color: #ffffff;
      background: #172033;
      border: 1px solid rgba(23, 32, 51, 0.16);
      box-shadow: 0 8px 16px rgba(23, 32, 51, 0.18);
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .github-corner-button:hover {
      transform: translateY(-1px);
      background: #0f172a;
      box-shadow: 0 12px 22px rgba(23, 32, 51, 0.22);
    }

    .github-corner-button:active {
      transform: translateY(0);
    }

    .github-corner-button:focus-visible {
      outline: 3px solid rgba(35, 87, 168, 0.36);
      outline-offset: 3px;
    }

    .github-corner-button svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: currentColor;
    }
'''

          media_css = '''
      .github-corner-button {
        width: 36px;
        height: 36px;
      }

      .github-corner-button svg {
        width: 20px;
        height: 20px;
      }
'''

          button = '''        <a class="github-corner-button" href="https://github.com/Brandon-Valley/LocalMonopoly" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub repository" title="GitHub repository">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2C6.477 2 2 6.484 2 12.021c0 4.428 2.865 8.184 6.839 9.508.5.092.682-.217.682-.483 0-.237-.009-.866-.014-1.7-2.782.605-3.369-1.343-3.369-1.343-.455-1.158-1.111-1.466-1.111-1.466-.908-.622.069-.609.069-.609 1.004.071 1.532 1.032 1.532 1.032.892 1.53 2.341 1.088 2.91.832.091-.647.35-1.088.636-1.338-2.221-.253-4.555-1.113-4.555-4.951 0-1.094.39-1.988 1.03-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.56 9.56 0 0 1 2.504.337c1.909-1.296 2.748-1.026 2.748-1.026.546 1.378.203 2.397.1 2.65.64.7 1.028 1.594 1.028 2.688 0 3.848-2.337 4.695-4.566 4.944.359.31.679.923.679 1.861 0 1.343-.012 2.426-.012 2.756 0 .268.18.58.688.482A10.024 10.024 0 0 0 22 12.021C22 6.484 17.523 2 12 2Z"></path>
          </svg>
        </a>
'''

          if '.github-corner-button' not in html:
              top_actions_css = '''    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
'''
              if top_actions_css not in html:
                  raise SystemExit('Could not find .top-actions CSS block')
              html = html.replace(top_actions_css, top_actions_css + css, 1)

              mobile_marker = '''      .top-actions {
        justify-content: stretch;
      }
'''
              if mobile_marker in html:
                  html = html.replace(mobile_marker, mobile_marker + media_css, 1)

          if 'class="github-corner-button"' not in html:
              top_actions_html = '      <div class="top-actions" id="topActions">\n'
              if top_actions_html not in html:
                  raise SystemExit('Could not find top actions HTML block')
              html = html.replace(top_actions_html, top_actions_html + button, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-github-button.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add GitHub repo button"
          git push
