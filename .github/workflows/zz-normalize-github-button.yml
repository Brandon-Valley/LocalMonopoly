name: Normalize GitHub button

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/zz-normalize-github-button.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/normalize-github-button.js
      - run: rm -f scripts/normalize-github-button.js .github/workflows/zz-normalize-github-button.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Normalize GitHub button placement
          file_pattern: index.html scripts/normalize-github-button.js .github/workflows/zz-normalize-github-button.yml
