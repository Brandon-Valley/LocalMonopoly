name: Header layout gh

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/zz-layout-gh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/layout-gh.js
      - run: rm -f scripts/layout-gh.js .github/workflows/zz-layout-gh.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update gh-pages header layout
          file_pattern: index.html scripts/layout-gh.js .github/workflows/zz-layout-gh.yml
