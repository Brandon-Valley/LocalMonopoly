name: Hard stop header button

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/zz-hard-stop-gh-button.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/hard-stop-gh-button.js
      - run: rm -f scripts/hard-stop-gh-button.js .github/workflows/zz-hard-stop-gh-button.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Hard stop GitHub button layout
          file_pattern: index.html scripts/hard-stop-gh-button.js .github/workflows/zz-hard-stop-gh-button.yml
