<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalMonopoly</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f0e4;color:#172033;display:grid;place-items:center}
    main{width:min(720px,calc(100vw - 32px));background:white;border:1px solid #d8d0bd;border-radius:22px;box-shadow:0 18px 45px rgba(23,32,51,.18);padding:22px}
    h1{margin:0 0 8px;font-size:28px;letter-spacing:-.04em}
    p{line-height:1.45;color:#647084}
    code{background:#f5f6f8;border:1px solid #d8d0bd;border-radius:8px;padding:2px 6px}
  </style>
</head>
<body>
  <main>
    <h1>Loading LocalMonopoly...</h1>
    <p>Unpacking the game page.</p>
  </main>
  <script>
    async function fetchText(path) {
      const response = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("Missing " + path + " (HTTP " + response.status + ")");
      return await response.text();
    }

    async function loadGame() {
      try {
        if (!("DecompressionStream" in window)) {
          throw new Error("This browser does not support DecompressionStream.");
        }

        const chunks = await Promise.all([
          fetchText("game_chunks/game.00.txt"),
          fetchText("game_chunks/game.06.txt")
        ]);

        const base64 = chunks.join("").replace(/\s+/g, "");
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const html = await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = `<main><h1>Could not load LocalMonopoly</h1><p>${String(error.message || error)}</p><p>Try a hard refresh. On Android Chrome: menu -> refresh, or clear this site's cached data.</p></main>`;
      }
    }

    loadGame();
  </script>
</body>
</html>
