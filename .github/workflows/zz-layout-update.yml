name: Header layout update

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/zz-layout-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/final-place-github-button.js
      - run: rm -f scripts/final-place-github-button.js .github/workflows/zz-layout-update.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update header button layout
          file_pattern: index.html scripts/final-place-github-button.js .github/workflows/zz-layout-update.yml
