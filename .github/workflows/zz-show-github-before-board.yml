name: Setup screen GitHub button

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/zz-show-github-before-board.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/show-github-before-board.js
      - run: rm -f scripts/show-github-before-board.js .github/workflows/zz-show-github-before-board.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Show GitHub button before board setup
          file_pattern: index.html scripts/show-github-before-board.js .github/workflows/zz-show-github-before-board.yml
