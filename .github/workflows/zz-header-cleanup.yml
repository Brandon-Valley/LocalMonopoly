name: Header button cleanup

on:
  push:
    branches:
      - gh-pages
    paths:
      - .github/workflows/zz-header-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/gh-button-cleanup.js
      - run: rm -f scripts/gh-button-cleanup.js .github/workflows/zz-header-cleanup.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Clean up header GitHub button
          file_pattern: index.html scripts/gh-button-cleanup.js .github/workflows/zz-header-cleanup.yml
