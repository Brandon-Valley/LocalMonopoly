<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalMonopoly</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f0e4;color:#172033;display:grid;place-items:center}
    main{width:min(720px,calc(100vw - 32px));background:white;border:1px solid #d8d0bd;border-radius:22px;box-shadow:0 18px 45px rgba(23,32,51,.18);padding:22px}

    p{line-height:1.45;color:#647084}
    code{background:#f5f6f8;border:1px solid #d8d0bd;border-radius:8px;padding:2px 6px}
  </style>
</head>
<body>
  <main>
    <h1>LocalMonopoly</h1>
    <p>The GitHub Pages deployment pipeline is installed. The full generated game HTML still needs to be written to <code>index.html</code>.</p>
    <p>Future pushes to <code>master</code> will automatically deploy through GitHub Actions.</p>
  </main>

</html>
