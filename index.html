<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Local Tycoon - Satellite Map Board Game</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f0e4; }
    iframe { position: fixed; inset: 0; width: 100vw; height: 100dvh; border: 0; background: #f4f0e4; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 900 18px system-ui, sans-serif; color: #172033; background: #f4f0e4; }
  </style>
</head>
<body>
  <div id="loading">Loading Local Tycoon...</div>
  <iframe id="game" title="Local Tycoon"></iframe>
  <script>
    (async function () {
      const response = await fetch('https://raw.githubusercontent.com/Brandon-Valley/LocalMonopoly/master/index.html?cache=' + Date.now(), { cache: 'no-store' });
      let html = await response.text();
      const patch = `<style>
        .github-corner-button {
          width: 34px !important;
          height: 34px !important;
          min-height: 34px !important;
          border-radius: 999px !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          flex: 0 0 auto !important;
          color: #fff !important;
          background: #172033 !important;
          border: 1px solid var(--line) !important;
          box-shadow: none !important;
          text-decoration: none !important;
          position: static !important;
          top: auto !important;
          right: auto !important;
          z-index: auto !important;
        }
        .github-corner-button svg {
          width: 24px !important;
          height: 24px !important;
          display: block !important;
          fill: currentColor !important;
        }
        body:not(.board-built) #topActions {
          display: flex !important;
          visibility: visible !important;
          opacity: 1 !important;
        }
        body:not(.board-built) #logsHudBtn,
        body:not(.board-built) #restartTopBtn {
          display: none !important;
        }
        body:not(.board-built) #topActions .github-corner-button {
          display: inline-flex !important;
        }
      </style>
      <script>
        (function () {
          function fixGithubButton() {
            var topActions = document.getElementById('topActions');
            var restart = document.getElementById('restartTopBtn');
            if (!topActions) return;
            document.querySelectorAll('a.github-corner-button').forEach(function (a) { a.remove(); });
            var a = document.createElement('a');
            a.className = 'github-corner-button';
            a.href = 'https://github.com/Brandon-Valley/LocalMonopoly';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.title = 'GitHub repository';
            a.setAttribute('aria-label', 'Open GitHub repository');
            a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2C6.477 2 2 6.484 2 12.021c0 4.428 2.865 8.184 6.839 9.508.5.092.682-.217.682-.483 0-.237-.009-.866-.014-1.7-2.782.605-3.369-1.343-3.369-1.343-.455-1.158-1.111-1.466-1.111-1.466-.908-.622.069-.609.069-.609 1.004.071 1.532 1.032 1.532 1.032.892 1.53 2.341 1.088 2.91.832.091-.647.35-1.088.636-1.338-2.221-.253-4.555-1.113-4.555-4.951 0-1.094.39-1.988 1.03-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.56 9.56 0 0 1 2.504.337c1.909-1.296 2.748-1.026 2.748-1.026.546 1.378.203 2.397.1 2.65.64.7 1.028 1.594 1.028 2.688 0 3.848-2.337 4.695-4.566 4.944.359.31.679.923.679 1.861 0 1.343-.012 2.426-.012 2.756 0 .268.18.58.688.482A10.024 10.024 0 0 0 22 12.021C22 6.484 17.523 2 12 2Z"></path></svg>';
            if (restart && restart.parentElement === topActions) restart.insertAdjacentElement('afterend', a);
            else topActions.appendChild(a);
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fixGithubButton); else fixGithubButton();
          setTimeout(fixGithubButton, 300);
          setTimeout(fixGithubButton, 1200);
        })();
      <\/script>`;
      html = html.replace('</head>', patch + '</head>');
      const frame = document.getElementById('game');
      frame.srcdoc = html;
      frame.addEventListener('load', function () { document.getElementById('loading').style.display = 'none'; }, { once: true });
      setTimeout(function () { document.getElementById('loading').style.display = 'none'; }, 2500);
    })().catch(function () { document.getElementById('loading').textContent = 'Could not load game. Refresh and try again.'; });
  </script>
</body>
</html>
