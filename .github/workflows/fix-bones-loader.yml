name: Fix bones loader

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-bones-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Patch index.html to load PNG asset directly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'const TERRAIN_BONE_DEMO_SOURCE = "assets/terrain-bone-demo-source.png.b64";',
              'const TERRAIN_BONE_DEMO_SOURCE = "assets/terrain-bone-demo-source.png";'
          )

          old_loader = '''    if (TERRAIN_BONE_DEMO_SOURCE.indexOf("data:") === 0) {
      terrainBoneDemoImage.src = TERRAIN_BONE_DEMO_SOURCE;
    } else {
      fetch(TERRAIN_BONE_DEMO_SOURCE)
        .then(function (response) {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.text();
        })
        .then(function (sourceText) {
          terrainBoneDemoImage.src = "data:image/png;base64," + sourceText.trim();
        })
        .catch(function (error) {
          console.warn("Terrain bone demo image failed to load.", error);
        });
    }'''

          new_loader = '    terrainBoneDemoImage.src = TERRAIN_BONE_DEMO_SOURCE;'
          text = text.replace(old_loader, new_loader)

          for workflow_name in ['fix-bones-loader.yml', 'fix-bones-asset.yml']:
              workflow = Path('.github/workflows') / workflow_name
              if workflow.exists():
                  workflow.unlink()

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git add index.html .github/workflows/fix-bones-loader.yml .github/workflows/fix-bones-asset.yml
          git commit -m "Fix bones image loader"
          git push origin master
